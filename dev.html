<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0a17" />
    <title>Agent Vilde — level bench</title>
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="styles/game.css" />
  </head>
  <body>
    <main id="app"></main>
    <script type="module">
      import { createStore } from './src/engine/storage.js';
      import { playLevel } from './src/game/play.js';
      import { levelById } from './src/game/levels/index.js';

      const store = createStore('agent-vilde-dev');
      const profile = store.activeProfile() ?? store.createProfile('Vilde');
      const [id = 'c1', step = '0', level = ''] = location.hash.slice(1).split('/');
      if (level) profile.settings.difficulty = level;
      if (id === 'mg') {
        const { openMinigame } = await import('./src/game/minigames/index.js');
        const { unlock } = await import('./src/game/audio.js');
        const host = document.createElement('div');
        host.className = 'game';
        document.getElementById('app').append(host);
        const params = JSON.parse(decodeURIComponent(level || '{}'));
        window.mg = openMinigame(host, step, params, { profile, say: console.log, onSuccess: () => console.log('SUCCESS'), onClose: () => console.log('CLOSE') });
      } else window.game = playLevel({
        root: document.getElementById('app'),
        level: levelById(id),
        profile,
        resumeStep: Number(step),
        onDone: (r) => console.log('done', r),
        onQuit: () => console.log('quit'),
      });
      window.profile = profile;
    </script>
  </body>
</html>
